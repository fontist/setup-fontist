name: Test action
on:
  push:
    branches: "main"
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE
      - .github/**
      - "!.github/workflows/test-action.yml"
  pull_request:
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE
      - .github/**
      - "!.github/workflows/test-action.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  # Platforms with Ruby 3.2+ by default
  test-native-ruby:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest      # 24.04 has Ruby 3.2+
          - ubuntu-24.04        # Ruby 3.2+
          - ubuntu-24.04-arm    # Ruby 3.2+
          - macos-latest       # Ruby 3.2+
          - macos-15           # Ruby 3.2+
          - macos-15-intel     # Ruby 3.2+
          - macos-26           # Ruby 3.2+
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: ./
        with:
          cache-dependency-path: test.yml
      - uses: ./
        with:
          cache-dependency-path: test.yml
      - run: fontist manifest install test.yml
        shell: bash

  # Platforms that need ruby/setup-ruby first
  test-with-setup-ruby:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04        # Ruby 3.0.2 - needs upgrade
          - ubuntu-22.04-arm    # Ruby 3.0.2 - needs upgrade
          - windows-latest      # Native extension issues
          - windows-2022        # Native extension issues
          - windows-2025        # Native extension issues
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - uses: ./
        with:
          cache-dependency-path: test.yml
      - uses: ./
        with:
          cache-dependency-path: test.yml
      - run: fontist manifest install test.yml
        shell: bash

  # Experimental: Windows ARM - Nokogiri doesn't support Windows ARM yet
  # When this passes, we know Nokogiri has added ARM support
  test-experimental-windows-arm:
    needs: build
    runs-on: windows-11-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - uses: ./
        with:
          cache-dependency-path: test.yml
      - uses: ./
        with:
          cache-dependency-path: test.yml
      - run: fontist manifest install test.yml
        shell: bash

  test-private-repos:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: ./
        with:
          github-token: ${{ secrets.FONTIST_CI_PAT_TOKEN }}
          formula-repos: |
            metanorma https://github.com/metanorma/fontist-formulas-private.git
      - run: fontist install "BSI Gesta"
